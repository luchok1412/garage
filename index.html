<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Автомеханик — Модульная версия</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { user-select: none; margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; overflow: hidden; height: 100vh; }
        
        /* ===== КОНСОЛЬ ===== */
        #bootConsole {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0c0c0c;
            color: #00ff41;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            padding: 20px;
            z-index: 1000;
            overflow-y: auto;
            box-shadow: inset 0 0 30px rgba(0,255,65,0.1);
        }
        .boot-line { white-space: pre-wrap; margin-bottom: 4px; opacity: 0; animation: fadeIn 0.2s forwards; }
        @keyframes fadeIn { to { opacity: 1; } }
        .boot-progress-bar {
            background: #1a3a1a;
            border-radius: 4px;
            height: 18px;
            width: 300px;
            overflow: hidden;
            display: inline-block;
            vertical-align: middle;
            margin-left: 10px;
        }
        .boot-progress-fill {
            background: #00ff41;
            height: 100%;
            width: 0%;
            transition: width 0.1s linear;
        }
        .boot-success { color: #00ff41; }
        .boot-error { color: #ff4444; }
        .boot-warning { color: #ffaa00; }
        
        /* ===== ОСНОВНОЙ ИНТЕРФЕЙС (стиль из твоего билда) ===== */
        #gameUI {
            display: none;
            background: #0f172a;
            min-height: 100vh;
            padding: 1.5rem;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .garage-slot {
            transition: all 0.2s;
            cursor: pointer;
            background-color: #1f2937;
            border-radius: 0.5rem;
            padding: 0.75rem;
        }
        .garage-slot:hover {
            transform: scale(1.02);
            background-color: #4b5563;
        }
        select, option {
            background-color: #1f2937;
            color: white;
        }
        .modal-bg {
            background-color: rgba(0,0,0,0.85);
            backdrop-filter: blur(3px);
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #374151; }
        ::-webkit-scrollbar-thumb { background: #6366f1; border-radius: 3px; }
        .game-toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #1e293b;
            border-left: 4px solid #3b82f6;
            padding: 12px 20px;
            border-radius: 12px;
            z-index: 200;
            animation: slideIn 0.3s;
            max-width: 320px;
            font-family: system-ui;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>

<!-- КОНСОЛЬ ЗАГРУЗКИ -->
<div id="bootConsole">
    <div class="boot-line">[BOOT] Автомеханик v2.0</div>
    <div class="boot-line">[BOOT] Инициализация модульной системы...</div>
    <div class="boot-line" id="bootStatus"></div>
</div>

<!-- ОСНОВНОЙ ИНТЕРФЕЙС (стиль из твоего билда) -->
<div id="gameUI">
    <div class="max-w-6xl mx-auto">
        <div class="flex flex-wrap justify-between items-center bg-gray-800 rounded-2xl p-4 mb-6 gap-3 shadow-xl">
            <div>
                <h1 class="text-3xl font-bold text-white">🔧 Автомеханик</h1>
                <p class="text-gray-400 text-sm">Уникальная ходовая | КПП | Полный тюнинг</p>
            </div>
            <div class="flex gap-2 flex-wrap">
                <div class="text-2xl font-bold text-green-400" id="moneyDisplay">1 500 000</div>
                <button id="warehouseBtn" class="bg-yellow-700 hover:bg-yellow-600 px-3 py-1 rounded text-sm transition">📦 Склад(<span id="warehouseCount">0</span>)</button>
                <button id="saveBtn" class="bg-green-700 hover:bg-green-600 px-3 py-1 rounded text-sm transition">💾</button>
                <button id="loadBtn" class="bg-blue-700 hover:bg-blue-600 px-3 py-1 rounded text-sm transition">📂</button>
            </div>
        </div>

        <div class="grid grid-cols-3 gap-3 mb-6">
            <button id="dumpBtn" class="bg-stone-700 hover:bg-stone-600 text-white font-bold py-3 rounded-xl text-lg shadow transition">🗑 СВАЛКА</button>
            <button id="shopBtn" class="bg-blue-800 hover:bg-blue-700 text-white font-bold py-3 rounded-xl text-lg shadow transition">🏪 МАГАЗИН</button>
            <button id="avitoBtn" class="bg-purple-800 hover:bg-purple-700 text-white font-bold py-3 rounded-xl text-lg shadow transition">🛒 АВТОВИТО</button>
        </div>

        <div class="bg-gray-800 rounded-xl p-4 shadow-xl">
            <h2 class="text-xl font-bold text-white mb-3">🚗 Гараж (2×3)</h2>
            <div id="garageGrid" class="grid grid-cols-3 gap-4"></div>
        </div>
    </div>
</div>

<script>
// ========== КОНСОЛЬ ==========
const bootConsole = document.getElementById("bootConsole");
const bootStatus = document.getElementById("bootStatus");

function bootLog(text, type = "info") {
    const line = document.createElement("div");
    line.className = "boot-line";
    if (type === "error") line.style.color = "#ff4444";
    else if (type === "progress") line.style.color = "#ffff00";
    else line.style.color = "#00ff41";
    line.innerHTML = `> ${text}`;
    bootConsole.appendChild(line);
    line.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function bootProgressBar(percent) {
    const bar = document.createElement("div");
    bar.className = "boot-line";
    const full = 30;
    const filled = Math.floor(percent / (100 / full));
    const empty = full - filled;
    bar.innerHTML = `> [${'█'.repeat(filled)}${'░'.repeat(empty)}] ${percent}%`;
    bootConsole.appendChild(bar);
}

function delay(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

// ========== ЗАГРУЗЧИК ==========
async function loadModule(name, url) {
    bootLog(`Загрузка ${name}.txt...`);
    try {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const text = await response.text();
        bootLog(`✅ ${name}.txt загружен (${text.split('\n').length} строк)`, "success");
        return text;
    } catch(e) {
        bootLog(`❌ ${name}.txt не найден! Путь: ${url}`, "error");
        return null;
    }
}

function parseCars(text) {
    return text.split('\n').filter(l => l.trim() && !l.startsWith('#')).map(l => {
        const [id, name, price, rarity, year, country, type] = l.split(',');
        return { id, name, basePrice: +price, rarity: +rarity, year: +year, country, type };
    });
}

async function bootSequence() {
    bootLog("Инициализация модульной системы...");
    await delay(500);
    
    // Загрузка модулей
    const carsText = await loadModule("cars", "modules/cars.txt");
    const tuningText = await loadModule("tuning", "modules/tuning.txt");
    const racersText = await loadModule("racers", "modules/racers.txt");
    const policeText = await loadModule("police", "modules/police.txt");
    
    if (!carsText) {
        bootLog("КРИТИЧЕСКАЯ ОШИБКА: Нет cars.txt", "error");
        bootLog("Проверьте папку modules/ и наличие файлов", "error");
        return;
    }
    
    const cars = parseCars(carsText);
    bootLog(`Обработано ${cars.length} машин`, "success");
    
    // Прогрузка каждой машины с прогресс-баром
    for (let i = 0; i < cars.length; i++) {
        bootLog(`cars: ${cars[i].name}...`, "progress");
        for (let p = 0; p <= 100; p += 20) {
            await delay(30);
        }
        bootProgressBar(100);
        bootLog(`✅ ${cars[i].name} — готов`, "success");
        await delay(50);
    }
    
    bootLog("");
    bootLog("🔧 Прогрузка тюнинг-деталей...", "progress");
    await delay(300);
    bootLog("✅ Тюнинг загружен", "success");
    
    bootLog("");
    bootLog("🏁 Инициализация гоночной системы...", "progress");
    await delay(200);
    bootLog("✅ Racers loaded", "success");
    
    bootLog("");
    bootLog("👮‍♂️ Инициализация ГИБДД...", "progress");
    await delay(200);
    bootLog("✅ Police services loaded", "success");
    
    bootLog("");
    bootLog("━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━");
    bootLog("🎮 Init graphics...", "progress");
    await delay(800);
    bootLog("━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━");
    bootLog("✅ ЗАГРУЗКА ЗАВЕРШЕНА УСПЕШНО", "success");
    bootLog("━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━");
    
    await delay(1000);
    
    // Плавное исчезновение консоли и появление игры
    bootConsole.style.transition = "opacity 0.8s";
    bootConsole.style.opacity = "0";
    setTimeout(() => {
        bootConsole.style.display = "none";
        document.getElementById("gameUI").style.display = "block";
        startGame(cars);
    }, 800);
}

// ========== ИГРА ==========
function startGame(cars) {
    const garageGrid = document.getElementById("garageGrid");
    
    // Показываем первые 6 машин в гараже
    garageGrid.innerHTML = cars.slice(0, 6).map((car, i) => `
        <div class="garage-slot" data-i="${i}">
            <div class="font-bold text-white">${car.name}</div>
            <div class="text-xs text-gray-300">${car.year} г.</div>
            <div class="text-green-400 text-sm">💰 ${car.basePrice.toLocaleString()}₽</div>
        </div>
    `).join('');
    
    function showToast(msg, isError = false) {
        const toast = document.createElement("div");
        toast.className = "game-toast";
        toast.style.borderLeftColor = isError ? "#ef4444" : "#3b82f6";
        toast.innerHTML = `<span>${isError ? "⚠️" : "✅"} ${msg}</span>`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }
    
    // Временные обработчики (пока модули не подключены полностью)
    document.getElementById("dumpBtn").onclick = () => showToast("🚧 Свалка будет в следующем обновлении", true);
    document.getElementById("shopBtn").onclick = () => showToast("🚧 Магазин будет в следующем обновлении", true);
    document.getElementById("avitoBtn").onclick = () => showToast("🚧 АвтоВито будет в следующем обновлении", true);
    document.getElementById("warehouseBtn").onclick = () => showToast("📦 Склад будет в следующем обновлении", true);
    document.getElementById("saveBtn").onclick = () => showToast("💾 Сохранение будет позже", true);
    document.getElementById("loadBtn").onclick = () => showToast("📂 Загрузка будет позже", true);
}

// ЗАПУСК
bootSequence();
</script>
</body>
</html>
