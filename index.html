<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Автомеханик — Модульная версия</title>
    <link rel="stylesheet" href="modules/style.css">
</head>
<body>

<!-- КОНСОЛЬ ЗАГРУЗКИ -->
<div id="bootConsole">
    <div class="boot-line">[BOOT] Автомеханик v2.0</div>
    <div class="boot-line">[BOOT] Инициализация модульной системы...</div>
</div>

<!-- ОСНОВНОЙ ИНТЕРФЕЙС -->
<div id="gameUI">
    <div class="container-center">
        <!-- Шапка -->
        <div class="game-header">
            <div>
                <div class="game-title">🔧 Автомеханик</div>
                <div class="game-subtitle">Уникальная ходовая | КПП | Полный тюнинг</div>
            </div>
            <div class="flex gap-3 items-center">
                <div class="money-box" id="moneyDisplay">1 500 000 ₽</div>
                <button id="warehouseBtn" class="bg-amber-700 hover:bg-amber-600 px-3 py-1 rounded-lg text-sm transition text-white">📦 Склад(<span id="warehouseCount">0</span>)</button>
                <button id="saveBtn" class="bg-emerald-700 hover:bg-emerald-600 px-3 py-1 rounded-lg text-sm transition text-white">💾</button>
                <button id="loadBtn" class="bg-sky-700 hover:bg-sky-600 px-3 py-1 rounded-lg text-sm transition text-white">📂</button>
            </div>
        </div>
        
        <!-- Кнопки действий -->
        <div class="action-buttons">
            <button id="dumpBtn" class="action-btn btn-dump">🗑 СВАЛКА</button>
            <button id="shopBtn" class="action-btn btn-shop">🏪 МАГАЗИН</button>
            <button id="avitoBtn" class="action-btn btn-avito">🛒 АВТОВИТО</button>
        </div>
        
        <!-- Гараж -->
        <div class="garage-card">
            <div class="garage-title">🚗 Гараж (2×3)</div>
            <div id="garageGrid" class="garage-grid"></div>
        </div>
    </div>
</div>

<script>
// ========== КОНСОЛЬ ==========
const bootConsole = document.getElementById("bootConsole");

function bootLog(text, type = "info") {
    const line = document.createElement("div");
    line.className = "boot-line";
    if (type === "error") line.style.color = "#ff4444";
    else if (type === "progress") line.style.color = "#ffff00";
    else line.style.color = "#00ff41";
    line.innerHTML = `> ${text}`;
    bootConsole.appendChild(line);
    line.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function bootProgressBar(percent) {
    const bar = document.createElement("div");
    bar.className = "boot-line";
    const full = 30;
    const filled = Math.floor(percent / (100 / full));
    const empty = full - filled;
    bar.innerHTML = `> [${'█'.repeat(filled)}${'░'.repeat(empty)}] ${percent}%`;
    bootConsole.appendChild(bar);
}

function delay(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

// ========== ЗАГРУЗЧИК ==========
async function loadModule(name, url) {
    bootLog(`Загрузка ${name}.txt...`);
    try {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const text = await response.text();
        bootLog(`✅ ${name}.txt загружен (${text.split('\n').length} строк)`, "success");
        return text;
    } catch(e) {
        bootLog(`❌ ${name}.txt не найден! Путь: ${url}`, "error");
        return null;
    }
}

function parseCars(text) {
    return text.split('\n').filter(l => l.trim() && !l.startsWith('#')).map(l => {
        const [id, name, price, rarity, year, country, type] = l.split(',');
        return { id, name, basePrice: parseInt(price), rarity: parseFloat(rarity), year: parseInt(year), country, type };
    });
}

async function bootSequence() {
    bootLog("Инициализация модульной системы...");
    await delay(500);
    
    const carsText = await loadModule("cars", "modules/cars.txt");
    const tuningText = await loadModule("tuning", "modules/tuning.txt");
    const racersText = await loadModule("racers", "modules/racers.txt");
    const policeText = await loadModule("police", "modules/police.txt");
    
    if (!carsText) {
        bootLog("КРИТИЧЕСКАЯ ОШИБКА: Нет cars.txt", "error");
        bootLog("Проверьте папку modules/ и наличие файлов", "error");
        return;
    }
    
    const cars = parseCars(carsText);
    bootLog(`Обработано ${cars.length} машин`, "success");
    
    for (let i = 0; i < cars.length; i++) {
        bootLog(`cars: ${cars[i].name}...`, "progress");
        for (let p = 20; p <= 100; p += 20) {
            await delay(25);
        }
        bootProgressBar(100);
        bootLog(`✅ ${cars[i].name} — готов`, "success");
        await delay(50);
    }
    
    bootLog("");
    bootLog("🔧 Прогрузка тюнинг-деталей...", "progress");
    await delay(300);
    bootLog("✅ Тюнинг загружен", "success");
    
    bootLog("");
    bootLog("🏁 Инициализация гоночной системы...", "progress");
    await delay(200);
    bootLog("✅ Racers loaded", "success");
    
    bootLog("");
    bootLog("👮‍♂️ Инициализация ГИБДД...", "progress");
    await delay(200);
    bootLog("✅ Police services loaded", "success");
    
    bootLog("");
    bootLog("━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━");
    bootLog("🎮 Init graphics...", "progress");
    await delay(800);
    bootLog("━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━");
    bootLog("✅ ЗАГРУЗКА ЗАВЕРШЕНА УСПЕШНО", "success");
    bootLog("━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━");
    
    await delay(1000);
    
    bootConsole.style.transition = "opacity 0.8s";
    bootConsole.style.opacity = "0";
    setTimeout(() => {
        bootConsole.style.display = "none";
        document.getElementById("gameUI").style.display = "block";
        startGame(cars);
    }, 800);
}

function startGame(cars) {
    const garageGrid = document.getElementById("garageGrid");
    
    garageGrid.innerHTML = cars.slice(0, 6).map((car, i) => `
        <div class="garage-slot" data-i="${i}">
            <div class="font-bold text-white">${car.name}</div>
            <div class="text-xs text-gray-300">${car.year} г.</div>
            <div class="text-green-400 text-sm">💰 ${car.basePrice.toLocaleString()}₽</div>
        </div>
    `).join('');
    
    function showToast(msg, isError = false) {
        const toast = document.createElement("div");
        toast.className = "game-toast";
        toast.style.borderLeftColor = isError ? "#ef4444" : "#3b82f6";
        toast.innerHTML = `<span>${isError ? "⚠️" : "✅"} ${msg}</span>`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }
    
    document.getElementById("dumpBtn").onclick = () => showToast("🚧 Свалка будет в следующем обновлении", true);
    document.getElementById("shopBtn").onclick = () => showToast("🚧 Магазин будет в следующем обновлении", true);
    document.getElementById("avitoBtn").onclick = () => showToast("🚧 АвтоВито будет в следующем обновлении", true);
    document.getElementById("warehouseBtn").onclick = () => showToast("📦 Склад будет в следующем обновлении", true);
    document.getElementById("saveBtn").onclick = () => showToast("💾 Сохранение будет позже", true);
    document.getElementById("loadBtn").onclick = () => showToast("📂 Загрузка будет позже", true);
}

bootSequence();
</script>
</body>
</html>
